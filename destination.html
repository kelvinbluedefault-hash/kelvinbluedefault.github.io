<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sector 03 // Uncharted Coordinates</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, #001154 0%, #000414 100%);
      color: #eef2ff;
      font-family: 'Space Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .secret-box {
      max-width: 480px;
      padding: 36px 26px;
      background: rgba(0, 17, 84, 0.45);
      border: 1px dashed #ffd700;
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 0 40px rgba(0, 17, 84, 0.8);
    }

    .badge {
      font-size: 11px;
      letter-spacing: 3px;
      color: #ffd700;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 28px;
      color: #fff;
      margin-bottom: 16px;
    }

    p {
      font-size: 14px;
      line-height: 1.7;
      color: #a4b4e6;
      margin-bottom: 24px;
    }

    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #ffd700;
      color: #ffd700;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
      border-radius: 20px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="secret-box">
    <div class="badge">// CLASSIFIED FREQUENCY REACHED</div>
    <h1>You found the hidden orbit.</h1>
    <p>
      <!-- You can put whatever surprise message, inside joke, future plan, or secret gift note you want right here! -->
      If you're reading this, your curiosity brought you all the way past the edge of the map. Here's one last secret: you mean the absolute universe to me.
    </p>
    <a href="voyage.html" class="back-btn">← Return to Orbit</a>
  </div>

</body>
</html>
